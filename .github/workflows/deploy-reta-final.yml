# Publica o app "Reta Final ENEM" no GitHub Pages a cada push na branch main.
# Para funcionar: no GitHub, vá em Settings → Pages → Source: "GitHub Actions".
name: Publicar Reta Final ENEM

on:
  push:
    branches: [main]
    paths: ['reta-final-enem/**', '.github/workflows/deploy-reta-final.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reta-final-enem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reta-final-enem/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reta-final-enem/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
