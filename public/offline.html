<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F5132" />
    <title>Sin conexión · Cóbralo</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1A1A1A; background: #fff; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 24px; margin: 20px 0 8px; }
      p { font-size: 17px; color: #6B7280; line-height: 1.5; margin: 0 0 24px; }
      button { width: 100%; min-height: 56px; border: 0; border-radius: 18px; background: #0F5132; color: #fff;
        font-size: 18px; font-weight: 600; font-family: inherit; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Cóbralo" />
      <h1>Sin conexión</h1>
      <p>Revisa tu internet. Tus datos están guardados y aparecerán cuando vuelvas a conectarte.</p>
      <button onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
